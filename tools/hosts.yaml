# Execution hosts for the LLVM export workstream.
#
# The GPU export steps must run ON the MI350X GPU host (gfx950);
# `buck2 run` executes locally, and RE's shared MI350 pool is too small
# for full exports (it does host the `:launch_re_test` smoke test).
# Fill in the hostname to let a scheduled run dispatch itself; when
# empty, the scheduled run pulls main, validates host-side, and reports
# the pending GPU export instead of failing silently.
#
# Each entry: ssh alias or hostname reachable non-interactively from the
# scheduler, plus the fbsource checkout path on that host (the export runs
# from a checkout that also has this workstream directory).

version: 1
method: ssh

gfx950:
  host: null # e.g. "mi350x-dev-01"
  user: null
  fbsource: null
  out: null
