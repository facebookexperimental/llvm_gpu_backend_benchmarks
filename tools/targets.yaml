# Targets for the Triton-Beta LLVM-stage export workstream.
#
# This file is the single source of truth for "every target selected to run"
# as a regular export process (e.g. the nightly job). It targets gfx950
# (MI350X) only, sorted by kernel source.
#
# Conventions:
# - `status: ready` means the export driver knows how to run this target.
# - `status: provisional` means the target is enumerated but its exact run
#   recipe is not yet validated on hardware; the first export run either
#   promotes it (artifacts land in the manifest) or records the failure.
# - `notes` always cites the source that justifies the entry.
# - `discover.py --check` validates this file against the live sources and
#   fails when a source adds a target this file does not mention.
#
# Artifact contract (see README.md): for every target the export writes
# `<out>/<arch>/<source>/<target>/<case>/` containing at minimum
# `kernel.llir` (the LLVM-stage input), `compile.json` (provenance incl. the
# winning config for multi-config kernels), plus best-effort `kernel.ttgir`,
# `kernel.ttir` and `kernel.amdgcn`.

version: 1
triton_channel: beta
# How multi-config kernels resolve to one LLVM input: run the kernel's own
# autotuner (or the driver's benchmark shortlist) and export the winner.
# `config_filter` is an optional Python `re` pattern matched against the
# config's repr to narrow the candidate set before selection.
best_config_policy: autotune_winner_then_benchmark
config_filter: null

arch:
  gfx950:
    gpu: MI350X
    tlx_ops:
      - op: mm
        space: heuristic
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd]
        status: ready
        notes: "_catalog.py mm/gfx950; only space available is heuristic"
      - op: addmm
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd]
        status: ready
        notes: "_catalog.py addmm/gfx950 fused_gemm"
      - op: grouped_gemm
        dtypes: [float16]
        suites: [correctness]
        modes: [fwd]
        status: ready
        notes: "_catalog.py grouped_gemm/gfx950; no FOCUS registry, use CORRECTNESS_SHAPES"
      - op: grouped_gemm_mxfp8
        dtypes: [float8_e4m3fn]
        suites: default
        modes: [fwd]
        status: provisional
        notes: "_catalog.py grouped_gemm_mxfp8/gfx950; forward-only; no _shapes registry, static shapes from test_grouped_gemm_mxfp8_gfx950_numerics"
      - op: mm_mxfp8
        dtypes: [float8_e4m3fn]
        suites: default
        modes: [fwd]
        status: provisional
        notes: "_catalog.py mm_mxfp8/gfx950 scaled_mfma; recipe unvalidated, curated on discover drift (2026-11)"
      - op: flash_attn
        space: full
        dtypes: [bfloat16]
        suites: default
        modes: [fwd, bwd]
        status: ready
        notes: "_catalog.py flash_attn/gfx950 supports_backward; FORWARD_ONLY shapes skip bwd"
      - op: flash_attn_mxfp8
        space: full
        dtypes: [bfloat16]
        suites: default
        modes: [fwd]
        status: ready
        notes: "_catalog.py flash_attn_mxfp8/gfx950; forward-only"
      - op: flash_attn_varlen
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd]
        status: ready
        notes: "_catalog.py flash_attn_varlen/gfx950 mfma_interleaved; forward-only packed varlen, HEAD_DIM 128"
      - op: flash_attn_varlen_backward
        dtypes: [bfloat16]
        suites: [correctness]
        modes: [bwd]
        status: provisional
        notes: "_catalog.py flash_attn_varlen_backward/gfx950 prepared; bf16-only D128 explicit gradients from a prepare_flash_attn_varlen_backward plan; only CORRECTNESS has a bf16 shape"
      - op: prepare_flash_attn_varlen_backward
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd]
        status: provisional
        notes: "_catalog.py prepare_flash_attn_varlen_backward/gfx950 host_validated; int32-offset plan build (dtypes only select length profiles)"
      - op: hstu_attn_dev
        space: full
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd, bwd]
        status: ready
        notes: "_catalog.py hstu_attn_dev/gfx950 supports_backward; causal-only"
      - op: hstu_cross_attn
        space: curated
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd, bwd]
        status: provisional
        notes: "_catalog.py hstu_cross_attn/gfx950 tlx_split_kv; supports_backward; FOCUS inference + training shapes; space curated: 8-config shortlist within 3.6% of the 144-grid best"
      - op: kda_paged_prefill
        dtypes: [bfloat16]
        suites: [prefill]
        modes: [fwd]
        status: ready
        notes: "_catalog.py kda_paged_prefill/gfx950; shapes from kda/_prefill_shapes.py"
      - op: kda_recurrent_decode
        dtypes: [bfloat16]
        suites: [decode]
        modes: [fwd]
        status: ready
        notes: "_catalog.py kda_recurrent_decode/gfx950; shapes from kda/_decode_shapes.py"
      - op: mm_torchtlx
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd]
        status: provisional
        notes: "_catalog.py mm_torchtlx/gfx950; inductor path via torch.compile"
      - op: addmm_torchtlx
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd]
        status: provisional
        notes: "_catalog.py addmm_torchtlx/gfx950; inductor path via torch.compile"
      - op: bmm_torchtlx
        dtypes: [float16, bfloat16]
        suites: default
        modes: [fwd]
        status: provisional
        notes: "_catalog.py bmm_torchtlx/gfx950; inductor path via torch.compile"
    tlx_tutorials:
      - module: amd_addmm_gfx950
        launcher: addmm
        inputs: {family: addmm, shapes: [[512, 512, 512], [1024, 1024, 1024], [4096, 4096, 4096]], dtype: float16, paths: auto}
        status: ready
        notes: "addmm(..., SPLIT_K, path, config); paths resolved via available_paths(); filename-pinned to gfx950"
      - module: amd_addmm_glu
        launcher: registry
        inputs: {family: addmm_glu, kernels: [tlx_baseline, tlx_simple_async, tlx_optimized_async, tlx_optimized, tlx_persistent]}
        status: ready
        notes: "KERNEL_REGISTRY; test_amd_addmm_glu is cdna4-gated"
      - module: amd_bmm
        launcher: bmm
        inputs: {family: bmm, shapes: [[4, 512, 512, 512], [8, 1024, 1024, 1024]], dtype: float16, input_fn: make_bmm_inputs}
        status: ready
        notes: "bmm(a, b, block_m, nw, nb); test_amd_bmm is cdna4-gated"
      - module: amd_bmm_shared_a
        launcher: bmm
        inputs: {family: bmm, shapes: [[4, 512, 512, 512], [8, 1024, 1024, 1024]], dtype: float16}
        status: ready
        notes: "test_shared_a_bmm_production is cdna4-gated"
      - module: amd_fa_pipelined
        launcher: attention
        inputs: {family: attn, batch: 2, heads: 8, seqlen: [1024, 4096], head_dim: 128, dtype: bfloat16}
        status: ready
        notes: "attention(q, k, v, sm_scale, causal, config); cdna4-gated"
      - module: amd_fa_persistent
        launcher: get_kernel
        inputs: {family: attn, kernels: [async_simple, async_prefetch, persistent], batch: 2, heads: 8, seqlen: 2048, head_dim: 128, dtype: bfloat16}
        status: ready
        notes: "get_kernel(name) over flash_attn_async_simple/_prefetch/_persistent; cdna4-gated"
      - module: amd_fa_cluster
        launcher: attention
        inputs: {family: attn, batch: 2, heads: 8, seqlen: [1024, 4096], head_dim: 128, dtype: bfloat16, persistent: true}
        status: ready
        notes: "attention + persistent_attention; cdna4-gated"
      - module: amd_fa_varlen_bwd
        launcher: fa_varlen_backward
        inputs: {family: varlen_bwd}
        status: provisional
        notes: "covered by test_tlx_amd_fa_bwd_gfx950.py; input plan via prepare_varlen_backward, exact recipe TBD on first run"
      - module: amd_fa_adaptive
        launcher: attention
        inputs: {family: attn, batch: 2, heads: 8, seqlen: [1024, 4096], head_dim: 128, dtype: bfloat16}
        status: provisional
        notes: "attention(...); perf coverage is is_hip()-gated; exact launcher kwargs TBD on first run"
      - module: amd_gemm_pipelined
        launcher: matmul
        inputs: {family: gemm, shapes: [[1024, 1024, 1024], [4096, 4096, 4096]], dtype: float16}
        status: ready
        notes: "compiled for the gfx950 target; is_hip()-gated"
      - module: amd_gemm_warp_pipeline
        launcher: matmul
        inputs: {family: gemm, shapes: [[1024, 1024, 1024], [4096, 4096, 4096]], dtype: float16}
        status: ready
        notes: "matmul(a, b, config); cdna4-gated"
      - module: amd_pa_decode
        launcher: pa_decode_tlx
        inputs: {family: pa_decode}
        status: ready
        notes: "build_inputs + pa_decode_tlx from language.tlx.ops.amd_pa_decode; recipe mirrors test_amd_pa_decode; cdna4-gated"
      - module: gfx9_gemm
        script: a16w16/bench.py
        inputs: {family: gemm_series}
        status: provisional
        notes: "v0..v9 + inter_wave + persistent series; v9/pingpong tests are cdna4-gated"
      - module: distributed/amd_dist_all_gather
        script: main
        inputs: {family: dist_all_gather}
        requires: [multi_gpu]
        status: provisional
        notes: "symmetric-memory all-gather; script-style tutorial, needs world_size>=2"
      - module: gfx950_gdpa
        launcher: gdpa
        inputs: {family: gdpa}
        status: ready
        notes: "gdpa via generate_gdpa_data + GDPA_CONFIG; recipe mirrors test_amd_gfx950_gdpa; cdna4-gated"
      - module: hstu_cross_attn
        script: tlx_gfx950_cross_attention.py
        inputs: {family: hstu}
        status: provisional
        notes: "gfx950-named modules; exact launcher TBD on first run (bench_bwd.py fallback)"
      - module: hstu_self_attn
        script: tlx_gfx950_ragged_hstu_attention.py
        inputs: {family: hstu}
        status: provisional
        notes: "gfx950-named modules; exact launcher TBD on first run (bench_self.py fallback)"
      - module: ikbo
        launcher: auto
        inputs: {family: ikbo}
        status: provisional
        notes: "ikbo_fa + ikbo_lce; supported on gfx950 per _IKBO_SUPPORTED; exact recipe TBD on first run"
    tritonbench:
      # The gfx950 set is benchmarks/nightly/mi350_ci.yaml. Subops that never
      # compile Triton kernels (aten/eager/mkl baselines) are filtered
      # automatically at capture time and recorded in the manifest.
      # addmm, flash_attention, fp8_gemm, bf16_gemm, fp32_gemm, and
      # generalized_dot_product_attention are excluded in discover.py
      # (TRITONBENCH_GFX950_EXCLUSIONS): they GPU-OOM on the shared host.
      - op: softmax
        args: "--op softmax --metrics latency,gbps,hw_roofline,compile_time --mode fwd --precision bypass --logging-group softmax"
        mode: fwd
        status: ready
        notes: "mi350_ci.yaml softmax"
      - op: fp8_gemm_rowwise
        args: "--op fp8_gemm_rowwise --metrics latency,tflops,gbps,hw_roofline,compile_time --mode fwd --precision bypass --logging-group fp8_gemm_rowwise_fast_accum --llama --only _triton"
        mode: fwd
        status: ready
        notes: "mi350_ci.yaml fp8_gemm_rowwise_fast_accum"
      - op: fp8_gemm_rowwise
        args: "--op fp8_gemm_rowwise --metrics latency,tflops,gbps,hw_roofline,compile_time --mode fwd --precision bypass --logging-group fp8_gemm_rowwise_fast_accum_prefill --llama --prefill --only _triton"
        mode: fwd
        status: ready
        notes: "mi350_ci.yaml fp8_gemm_rowwise_fast_accum_prefill"
      # Explicitly out of scope (kept here so --check does not flag them):
      # - jagged_flash_attention / jagged_dense_bmm mi350 entries run mkl/amkl
      #   subops only: no Triton kernels, nothing to export.
      # - gfx1250-only tutorials (amd_tdm_gemm_pipelined,
      #   amd_mxfp_gemm_tdm_pipelined, amd_fa_tdm_pipelined,
      #   amd_grouped_gemm_gfx1250): wrong hardware.
      # - amd_fa_adaptive_bench, amd_fa_compare, accuracy_bench_*: harness
      #   scripts, covered through the kernel modules they drive.
      # - blackwell_*/hopper_*/fused_attention_ws_*: NVIDIA-only.
      # - addmm, flash_attention, fp8_gemm, bf16_gemm, fp32_gemm,
      #   generalized_dot_product_attention: GPU-OOM on the shared host
      #   (see TRITONBENCH_GFX950_EXCLUSIONS in discover.py).
