name: Nightly LLVM LLIR

# Runs every committed kernel.llir through the newest published LLVM
# (apt.llvm.org nightly snapshot) and opens a PR with the refreshed
# results. The nightly PR is the notification mechanism: it never
# auto-merges, and a red night updates the tracking issue instead.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      llvm_branch:
        description: "apt.llvm.org snapshot branch (empty = latest)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install newest published LLVM (nightly snapshot)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          if [ -n "${{ inputs.llvm_branch }}" ]; then
            sudo ./llvm.sh "${{ inputs.llvm_branch }}"
          else
            sudo ./llvm.sh all
          fi
          llc --version | head -1 || true
          ls /usr/lib/llvm-*/bin/llc

      - name: Run all LLIR with the newest LLVM
        id: run
        run: |
          export LLVM_BIN="$(dirname "$(ls /usr/lib/llvm-*/bin/llc | sort -V | tail -1)")"
          echo "LLVM_BIN=$LLVM_BIN" >> "$GITHUB_ENV"
          python3 .github/scripts/run_nightly_llir.py . | tee nightly-log.txt

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-llvm-results
          path: |
            nightly-results.json
            nightly-summary.md
            nightly-log.txt
          retention-days: 30

      - name: Open or update the nightly PR
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: nightly/llvm-results
          delete-branch: true
          title: "[nightly] Refresh LLIR results with newest LLVM"
          commit-message: "[nightly] Refresh LLIR results with newest LLVM"
          body-path: nightly-summary.md
          labels: nightly
          add-paths: |
            nightly-results.json
            nightly-summary.md

      - name: File or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly LLVM LLIR failure"
          body="$(cat nightly-summary.md 2>/dev/null || cat nightly-log.txt)"
          existing="$(gh issue list --label nightly --state open --search "$title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label nightly --body "$body"
          fi
